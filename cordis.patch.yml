# GitChat bundle patch: inserts the dual-face plugin row into the web profile.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field) over
# dsh-base. Activate with:
#   dsh plugin --profile <name> add link:<path-to-this-package>
# and add "dsh-gitchat" to the profile's dsh.profile.bundles list.
- insert:
    - id: ui-gitchat
      name: 'dsh-gitchat'
