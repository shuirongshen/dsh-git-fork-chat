<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>GitChat · standalone preview</title>
    <link rel="stylesheet" href="preview.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f6f6f8;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      .preview-theme-toggle {
        position: fixed;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        height: 30px;
        padding: 0 11px;
        border: 1px solid rgba(20, 20, 24, 0.16);
        border-radius: 999px;
        background: rgba(20, 20, 24, 0.78);
        color: #fff;
        font: 600 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      }

      .preview-theme-toggle:hover {
        background: rgba(20, 20, 24, 0.9);
      }

      body[data-preview-theme='dark'] {
        background: #141417;
      }

      body[data-preview-theme='dark'] .preview-theme-toggle {
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(245, 245, 247, 0.92);
        color: #17171a;
      }

      body[data-preview-theme='dark'] .preview-theme-toggle:hover {
        background: #ffffff;
      }

      /* Simulated DSH dark theme tokens, used only by the standalone preview.
         The real plugin reads these tokens from the DSH shell. */
      body[data-preview-theme='dark'] {
        --dsw-alias-bg-base: #141417;
        --dsw-alias-bg-layer-1: #1b1b20;
        --dsw-alias-bg-layer-2: #232329;
        --dsw-alias-bg-layer-3: #2c2c34;
        --dsw-alias-bg-overlay: #2a2a31;
        --dsw-alias-border-l1: #26262d;
        --dsw-alias-border-l2: #34343d;
        --dsw-alias-border-l3: #44444f;
        --dsw-alias-border-l4: #555561;
        --dsw-alias-label-primary: #f2f2f5;
        --dsw-alias-label-secondary: #b8b8c2;
        --dsw-alias-label-tertiary: #8c8c97;
        --dsw-alias-label-primary-inverted: #17171a;
        --dsw-alias-brand-primary: #f2f2f5;
        --dsw-alias-button-primary-fill: #f2f2f5;
        --dsw-alias-button-primary-hover: #ffffff;
        --dsw-alias-button-info-fill: #7f9cff;
        --dsw-alias-state-business-primary: #7f9cff;
        --dsw-alias-button-tool-bar-fill: #2a2a3180;
        --dsw-alias-button-tool-bar-hover: #34343d99;
        --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.07);
        --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.12);
        --dsw-alias-state-error-primary: #ff6b6b;
        --dsw-alias-state-success-primary: #4ade80;
        --dsw-alias-state-warn-primary: #fbbf24;
        --dsw-alias-state-idle-primary: #8c8c97;
        --dsw-alias-tooltip-bg: #f2f2f5;
        --dsw-alias-tooltip-label: #17171a;
        --dsw-specific-menu: #1b1b20;
        --dsw-shadow-lv2: 0 6px 18px rgba(0, 0, 0, 0.5);
        --dsw-shadow-lv3: 0 12px 32px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="preview.js" defer></script>
  </body>
</html>
